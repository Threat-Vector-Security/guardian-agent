app = "guardian-agent-example"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  GUARDIAN_BASE_DIR = "/data"
  GUARDIAN_CONFIG_PATH = "/data/config.yaml"
  GUARDIAN_PROJECTS_DIR = "/data/projects"
  LOG_LEVEL = "info"

[mounts]
  source = "guardian_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
